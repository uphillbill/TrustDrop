<svg xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Segoe UI', sans-serif" viewBox="0 0 720 520"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#0d1526"/><stop offset="50%" style="stop-color:#111c32"/><stop offset="100%" style="stop-color:#0d1526"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1b2740" stroke-width=".35" d="M 28 0 L 0 0 0 28" opacity=".25"/></pattern><filter id="gT" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="b" stdDeviation="3"/><feFlood flood-color="#309ab0" flood-opacity=".35"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gG" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="b" stdDeviation="3"/><feFlood flood-color="#34d399" flood-opacity=".35"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gY" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="b" stdDeviation="2"/><feFlood flood-color="#fbbf24" flood-opacity=".3"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow" width="110%" height="120%" x="-5%" y="-5%"><feDropShadow dx="0" dy="3" flood-color="#000" flood-opacity=".4" stdDeviation="5"/></filter></defs><rect width="720" height="520" fill="url(#bg)"/><rect width="720" height="520" fill="url(#grid)"/><rect width="720" height="50" x="0" y="0" fill="#0d1526" opacity=".85"/><text x="360" y="24" fill="#e6eaf0" font-size="16" font-weight="700" letter-spacing="2.5" text-anchor="middle">TRUSTDROP · URL ANATOMY</text><text x="360" y="42" fill="#7d8a9a" font-size="9.5" letter-spacing="2" text-anchor="middle">WHAT THE SERVER SEES vs. WHAT STAYS IN YOUR BROWSER</text><rect width="664" height="56" x="28" y="68" fill="#131d30" stroke="#1b2740" stroke-width="1.5" filter="url(#shadow)" rx="10"/><circle cx="50" cy="82" r="4.5" fill="#ef4444" opacity=".7"/><circle cx="66" cy="82" r="4.5" fill="#fbbf24" opacity=".7"/><circle cx="82" cy="82" r="4.5" fill="#34d399" opacity=".7"/><rect width="12" height="9" x="104" y="88" fill="none" stroke="#34d399" stroke-width="1.2" rx="2"/><path fill="none" stroke="#34d399" stroke-width="1.2" d="M107 88 L107 84 A3 3 0 0 1 113 84 L113 88"/><text x="122" y="98" fill="#7d8a9a" font-size="9">HTTPS</text><rect width="302" height="24" x="148" y="86" fill="#309ab0" opacity=".04" rx="4"/><rect width="228" height="24" x="450" y="86" fill="#34d399" opacity=".04" rx="4"/><text y="103"><tspan x="152" fill="#309ab0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" font-weight="600">https://trustdrop.com/s/a8f3x</tspan><tspan fill="#fbbf24" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="800">#</tspan><tspan fill="#34d399" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" font-weight="600">k=7Bq9...</tspan><tspan fill="#34d399" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12.5" font-weight="600">&amp;iv=xP2m...</tspan></text><line x1="152" x2="152" y1="130" y2="140" stroke="#309ab0" stroke-width="1.2"/><line x1="152" x2="300" y1="140" y2="140" stroke="#309ab0" stroke-width="1.2"/><line x1="448" x2="300" y1="140" y2="140" stroke="#309ab0" stroke-width="1.2"/><line x1="448" x2="448" y1="130" y2="140" stroke="#309ab0" stroke-width="1.2"/><line x1="300" x2="300" y1="140" y2="150" stroke="#309ab0" stroke-width="1.2"/><circle cx="300" cy="155" r="3" fill="#309ab0" filter="url(#gT)"/><line x1="454" x2="454" y1="130" y2="140" stroke="#34d399" stroke-width="1.2"/><line x1="454" x2="548" y1="140" y2="140" stroke="#34d399" stroke-width="1.2"/><line x1="640" x2="548" y1="140" y2="140" stroke="#34d399" stroke-width="1.2"/><line x1="640" x2="640" y1="130" y2="140" stroke="#34d399" stroke-width="1.2"/><line x1="548" x2="548" y1="140" y2="150" stroke="#34d399" stroke-width="1.2"/><circle cx="548" cy="155" r="3" fill="#34d399" filter="url(#gG)"/><line x1="452" x2="452" y1="112" y2="128" stroke="#fbbf24" stroke-dasharray="3 2" stroke-width="1"/><rect width="56" height="18" x="424" y="128" fill="#1a1708" stroke="#fbbf24" stroke-width=".8" rx="4"/><text x="452" y="140" fill="#fbbf24" font-size="8" font-weight="700" letter-spacing=".5" text-anchor="middle">SEPARATOR</text><rect width="310" height="208" x="36" y="170" fill="#131d30" stroke="#309ab0" stroke-width="1.2" filter="url(#shadow)" rx="10"/><rect width="310" height="34" x="36" y="170" fill="#309ab0" opacity=".05" rx="10"/><rect width="310" height="9" x="36" y="195" fill="#309ab0" opacity=".05" rx="0"/><circle cx="58" cy="187" r="5" fill="#309ab0" filter="url(#gT)"/><text x="72" y="192" fill="#309ab0" font-size="11" font-weight="700" letter-spacing="1.5">SENT TO SERVER</text><rect width="74" height="16" x="260" y="179" fill="#309ab0" opacity=".08" rx="3"/><text x="297" y="191" fill="#309ab0" font-size="8" font-weight="600" text-anchor="middle">IN HTTP REQUEST</text><text x="56" y="228" fill="#7d8a9a" font-size="9.5" font-weight="600" letter-spacing=".5">PROTOCOL</text><text x="156" y="228" fill="#309ab0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">https://</text><line x1="56" x2="326" y1="238" y2="238" stroke="#1b2740" stroke-width=".5"/><text x="56" y="258" fill="#7d8a9a" font-size="9.5" font-weight="600" letter-spacing=".5">HOSTNAME</text><text x="156" y="258" fill="#309ab0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">trustdrop.com</text><line x1="56" x2="326" y1="268" y2="268" stroke="#1b2740" stroke-width=".5"/><text x="56" y="288" fill="#7d8a9a" font-size="9.5" font-weight="600" letter-spacing=".5">PATH</text><text x="156" y="288" fill="#309ab0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">/s/a8f3x</text><line x1="56" x2="326" y1="298" y2="298" stroke="#1b2740" stroke-width=".5"/><text x="56" y="318" fill="#7d8a9a" font-size="9.5" font-weight="600" letter-spacing=".5">QUERY STRING</text><text x="156" y="318" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">(none)</text><rect width="290" height="34" x="46" y="336" fill="#309ab0" stroke="#309ab0" stroke-width=".5" opacity=".04" rx="5"/><text x="56" y="350" fill="#7d8a9a" font-size="9">Server learns:</text><text x="130" y="350" fill="#309ab0" font-size="9" font-weight="600">which secret ID was requested</text><text x="56" y="364" fill="#7d8a9a" font-size="9">Sufficient to:</text><text x="120" y="364" fill="#309ab0" font-size="9" font-weight="600">retrieve the ciphertext blob</text><rect width="310" height="208" x="374" y="170" fill="#0f1a22" stroke="#34d399" stroke-width="1.2" filter="url(#shadow)" rx="10"/><rect width="310" height="34" x="374" y="170" fill="#34d399" opacity=".04" rx="10"/><rect width="310" height="9" x="374" y="195" fill="#34d399" opacity=".04" rx="0"/><circle cx="396" cy="187" r="5" fill="#34d399" filter="url(#gG)"/><text x="410" y="192" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.5">NEVER LEAVES BROWSER</text><rect width="80" height="16" x="592" y="179" fill="#34d399" opacity=".06" rx="3"/><text x="632" y="191" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">CLIENT-SIDE ONLY</text><text x="394" y="228" fill="#7d8a9a" font-size="9.5" font-weight="600" letter-spacing=".5">FRAGMENT ID</text><text x="494" y="228" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">#</text><line x1="394" x2="664" y1="238" y2="238" stroke="#1a3029" stroke-width=".5"/><text x="394" y="258" fill="#7d8a9a" font-size="9.5" font-weight="600" letter-spacing=".5">AES KEY</text><text x="494" y="258" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">k=7Bq9...mP4w</text><line x1="394" x2="664" y1="268" y2="268" stroke="#1a3029" stroke-width=".5"/><text x="394" y="288" fill="#7d8a9a" font-size="9.5" font-weight="600" letter-spacing=".5">IV / NONCE</text><text x="494" y="288" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">iv=xP2m...rY8q</text><line x1="394" x2="664" y1="298" y2="298" stroke="#1a3029" stroke-width=".5"/><text x="394" y="318" fill="#7d8a9a" font-size="9.5" font-weight="600" letter-spacing=".5">USED FOR</text><text x="494" y="318" fill="#34d399" font-size="11" font-weight="600">AES-256-GCM decryption</text><rect width="290" height="34" x="384" y="336" fill="#34d399" stroke="#34d399" stroke-width=".5" opacity=".03" rx="5"/><text x="394" y="350" fill="#7d8a9a" font-size="9">Server sees:</text><text x="456" y="350" fill="#ef4444" font-size="9" font-weight="700">NOTHING — fragment stripped by browser</text><text x="394" y="364" fill="#7d8a9a" font-size="9">Per:</text><text x="418" y="364" fill="#34d399" font-size="9" font-weight="500">RFC 3986 §3.5 — fragment is client-only</text><rect width="648" height="72" x="36" y="396" fill="#131d30" stroke="#fbbf24" stroke-width=".8" filter="url(#shadow)" rx="8"/><rect width="648" height="26" x="36" y="396" fill="#fbbf24" opacity=".03" rx="8"/><rect width="648" height="8" x="36" y="414" fill="#fbbf24" opacity=".03" rx="0"/><rect width="14" height="11" x="52" y="404" fill="none" stroke="#fbbf24" stroke-width="1.2" rx="1.5"/><line x1="52" x2="66" y1="409" y2="409" stroke="#fbbf24" stroke-width=".8"/><text x="75" y="415" fill="#fbbf24" font-size="10.5" font-weight="700" letter-spacing="1">WHY THIS WORKS — RFC 3986 §3.5</text><text x="52" y="440" fill="#b8c0cc" font-size="10.5">The fragment component (everything after <tspan fill="#fbbf24" font-weight="700">#</tspan>) is processed exclusively by the user agent (browser).</text><text x="52" y="456" fill="#b8c0cc" font-size="10.5">It is <tspan fill="#ef4444" font-weight="700">never included</tspan> in the HTTP request sent to the server — making it the perfect transport for the decryption key.</text><rect width="648" height="28" x="36" y="482" fill="#131d30" stroke="#1b2740" stroke-width=".6" rx="5"/><rect width="10" height="10" x="52" y="490" fill="#309ab0" stroke="#309ab0" stroke-width=".8" opacity=".2" rx="2"/><text x="68" y="500" fill="#7d8a9a" font-size="9.5">Sent to server</text><rect width="10" height="10" x="172" y="490" fill="#34d399" stroke="#34d399" stroke-width=".8" opacity=".15" rx="2"/><text x="188" y="500" fill="#7d8a9a" font-size="9.5">Client-side only (secret)</text><rect width="10" height="10" x="332" y="490" fill="#fbbf24" stroke="#fbbf24" stroke-width=".8" opacity=".15" rx="2"/><text x="348" y="500" fill="#7d8a9a" font-size="9.5"># Fragment separator</text><rect width="10" height="10" x="500" y="490" fill="#ef4444" stroke="#ef4444" stroke-width=".8" opacity=".15" rx="2"/><text x="516" y="500" fill="#7d8a9a" font-size="9.5">Blocked / never transmitted</text></svg>