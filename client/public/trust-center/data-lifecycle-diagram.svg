ke-width="1" marker-end="url(#aW)" opacity=".4"/><text x="340" y="238" fill="#475569" font-size="8.5" font-weight="500" letter-spacing="3" text-anchor="middle">TIME →</text><rect width="648" height="28" x="36" y="260" fill="#ef4444" stroke="#ef4444" stroke-width=".6" opacity=".03" rx="6"/><circle cx="56" cy="274" r="4" fill="#ef4444" filter="url(#gR)"/><text x="68" y="279" fill="#ef4444" font-size="11" font-weight="700" letter-spacing="1.5">DELETION TRIGGERS</text><text x="280" y="279" fill="#7d8a9a" font-size="9">Whichever condition is met first — checked independently</text><line x1="360" x2="360" y1="288" y2="302" stroke="#ef4444" stroke-width=".8" opacity=".3"/><rect width="200" height="100" x="36" y="302" fill="#131d30" stroke="#ef4444" stroke-width=".8" filter="url(#shadow)" rx="8"/><rect width="200" height="28" x="36" y="302" fill="#ef4444" opacity=".03" rx="8"/><rect width="200" height="8" x="36" y="322" fill="#ef4444" opacity=".03" rx="0"/><circle cx="56" cy="316" r="6" fill="none" stroke="#f87171" stroke-width="1"/><circle cx="56" cy="316" r="2" fill="#f87171"/><text x="70" y="320" fill="#f87171" font-size="10.5" font-weight="700">VIEWED</text><text x="50" y="348" fill="#b8c0cc" font-size="10">View limit reached</text><text x="50" y="366" fill="#7d8a9a" font-size="9">Default: <tspan fill="#f87171" font-weight="600">1 view</tspan> (burn after reading)</text><text x="50" y="382" fill="#7d8a9a" font-size="9">Configurable: 1–100 views</text><text x="50" y="396" fill="#596679" font-size="8.5">Counter decrements on each access</text><rect width="200" height="100" x="260" y="302" fill="#131d30" stroke="#ef4444" stroke-width=".8" filter="url(#shadow)" rx="8"/><rect width="200" height="28" x="260" y="302" fill="#ef4444" opacity=".03" rx="8"/><rect width="200" height="8" x="260" y="322" fill="#ef4444" opacity=".03" rx="0"/><circle cx="280" cy="316" r="6" fill="none" stroke="#f87171" stroke-width="1"/><line x1="280" x2="280" y1="313" y2="316" stroke="#f87171" stroke-