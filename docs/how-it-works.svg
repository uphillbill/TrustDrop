<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 960 620"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#080c18"/><stop offset="100%" style="stop-color:#0b1022"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".35" d="M 30 0 L 0 0 0 30" opacity=".2"/></pattern><filter id="gG" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="b" stdDeviation="3"/><feFlood flood-color="#22c55e" flood-opacity=".45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gB" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="b" stdDeviation="3"/><feFlood flood-color="#3b82f6" flood-opacity=".45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gY" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="b" stdDeviation="3"/><feFlood flood-color="#eab308" flood-opacity=".4"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gC" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="b" stdDeviation="3"/><feFlood flood-color="#06b6d4" flood-opacity=".45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gR" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="b" stdDeviation="4"/><feFlood flood-color="#ef4444" flood-opacity=".45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gP" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="b" stdDeviation="3"/><feFlood flood-color="#a855f7" flood-opacity=".4"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow" width="110%" height="120%" x="-5%" y="-5%"><feDropShadow dx="0" dy="3" flood-color="#000" flood-opacity=".45" stdDeviation="5"/></filter><marker id="aW" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#334155" points="0 0 8 3 0 6"/></marker><marker id="aG" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#22c55e" points="0 0 8 3 0 6"/></marker><marker id="aB" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#3b82f6" points="0 0 8 3 0 6"/></marker><marker id="aY" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#eab308" points="0 0 8 3 0 6"/></marker><marker id="aC" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#06b6d4" points="0 0 8 3 0 6"/></marker><marker id="aR" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#ef4444" points="0 0 8 3 0 6"/></marker><marker id="aP" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#a855f7" points="0 0 8 3 0 6"/></marker></defs><rect width="960" height="620" fill="url(#bg)"/><rect width="960" height="620" fill="url(#grid)"/><text x="480" y="36" fill="#f1f5f9" font-size="20" font-weight="700" letter-spacing="2" text-anchor="middle">HOW TRUSTDROP WORKS</text><text x="480" y="56" fill="#64748b" font-size="10.5" letter-spacing="2" text-anchor="middle">ZERO-KNOWLEDGE SECRET SHARING IN 6 STEPS</text><line x1="340" x2="620" y1="66" y2="66" stroke="#3b82f6" stroke-width="1" opacity=".25"/><text x="38" y="98" fill="#22c55e" font-size="9" font-weight="600" letter-spacing="2" opacity=".5">SENDER</text><g><rect width="250" height="120" x="32" y="110" fill="#0b1a12" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)" rx="12"/><circle cx="56" cy="134" r="12" fill="#0b1a12" stroke="#22c55e" stroke-width="1.5" filter="url(#gG)"/><text x="56" y="138" fill="#22c55e" font-size="11" font-weight="800" text-anchor="middle">1</text><text x="76" y="139" fill="#22c55e" font-size="13" font-weight="700">Write Your Secret</text><rect width="210" height="28" x="52" y="156" fill="#0f2618" stroke="#22c55e" stroke-width=".7" opacity=".8" rx="5"/><text x="64" y="174" fill="#4ade80" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="10" opacity=".8">db_password = s3cr3t!</text><circle cx="248" cy="170" r="3" fill="#22c55e" opacity=".5"/><text x="52" y="206" fill="#94a3b8" font-size="9.5">Enter any sensitive text — passwords,</text><text x="52" y="220" fill="#94a3b8" font-size="9.5">API keys, credentials, private notes.</text></g><line x1="286" x2="340" y1="170" y2="170" stroke="#22c55e" stroke-width="1.8" marker-end="url(#aG)" opacity=".6"/><g><rect width="250" height="120" x="348" y="110" fill="#0c1630" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow)" rx="12"/><circle cx="372" cy="134" r="12" fill="#0c1630" stroke="#3b82f6" stroke-width="1.5" filter="url(#gB)"/><text x="372" y="138" fill="#60a5fa" font-size="11" font-weight="800" text-anchor="middle">2</text><text x="392" y="139" fill="#60a5fa" font-size="13" font-weight="700">Encrypted in Browser</text><rect width="36" height="26" x="446" y="162" fill="#0c1630" stroke="#3b82f6" stroke-width="1.5" rx="5"/><path fill="none" stroke="#3b82f6" stroke-width="1.5" d="M453 162 L453 155 A11 11 0 0 1 475 155 L475 162"/><circle cx="464" cy="176" r="3" fill="#60a5fa"/><line x1="464" x2="464" y1="179" y2="184" stroke="#60a5fa" stroke-width="1.5"/><rect width="82" height="18" x="368" y="198" fill="#3b82f6" stroke="#3b82f6" stroke-width=".6" opacity=".1" rx="4"/><text x="409" y="211" fill="#60a5fa" font-size="9" font-weight="600" text-anchor="middle">AES-256-GCM</text><text x="456" y="211" fill="#64748b" font-size="9">client-side</text></g><line x1="602" x2="656" y1="170" y2="170" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#aB)" opacity=".6"/><g><rect width="262" height="120" x="664" y="110" fill="#1a1708" stroke="#eab308" stroke-width="1.2" filter="url(#shadow)" rx="12"/><circle cx="688" cy="134" r="12" fill="#1a1708" stroke="#eab308" stroke-width="1.5" filter="url(#gY)"/><text x="688" y="138" fill="#eab308" font-size="11" font-weight="800" text-anchor="middle">3</text><text x="708" y="139" fill="#eab308" font-size="13" font-weight="700">Get Shareable Link</text><rect width="222" height="28" x="684" y="156" fill="#1a1506" stroke="#eab308" stroke-width=".7" opacity=".8" rx="5"/><text x="696" y="174" fill="#60a5fa" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="9">trustdrop.co/s/x8f</text><text x="836" y="174" fill="#eab308" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="9">#key</text><text x="684" y="204" fill="#94a3b8" font-size="9.5">Key embedded in URL fragment —</text><text x="684" y="218" fill="#eab308" font-size="9.5" font-weight="500">never sent to the server.</text></g><path fill="none" stroke="#eab308" stroke-dasharray="6 4" stroke-width="1.5" marker-end="url(#aY)" d="M 795 234 L 795 265 C 795 280, 795 280, 770 290 L 640 290 C 620 290, 620 290, 620 305" opacity=".5"/><rect width="120" height="20" x="660" y="260" fill="#0b1022" stroke="#eab308" stroke-width=".6" opacity=".85" rx="4"/><text x="720" y="274" fill="#eab308" font-size="9" font-weight="500" text-anchor="middle">Share via Email / Slack / SMS</text><text x="38" y="330" fill="#06b6d4" font-size="9" font-weight="600" letter-spacing="2" opacity=".5">RECIPIENT</text><g><rect width="250" height="120" x="474" y="342" fill="#081a1e" stroke="#06b6d4" stroke-width="1.2" filter="url(#shadow)" rx="12"/><circle cx="498" cy="366" r="12" fill="#081a1e" stroke="#06b6d4" stroke-width="1.5" filter="url(#gC)"/><text x="498" y="370" fill="#06b6d4" font-size="11" font-weight="800" text-anchor="middle">4</text><text x="518" y="371" fill="#06b6d4" font-size="13" font-weight="700">Open the Link</text><rect width="210" height="24" x="494" y="390" fill="#0a1820" stroke="#06b6d4" stroke-width=".7" opacity=".8" rx="5"/><circle cx="507" cy="402" r="3" fill="#ef4444" opacity=".5"/><circle cx="517" cy="402" r="3" fill="#eab308" opacity=".5"/><circle cx="527" cy="402" r="3" fill="#22c55e" opacity=".5"/><text x="540" y="406" fill="#67e8f9" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="8">trustdrop.co/s/x8f#key</text><text x="494" y="436" fill="#94a3b8" font-size="9.5">Browser fetches ciphertext from server.</text><text x="494" y="450" fill="#06b6d4" font-size="9.5" font-weight="500">Key stays in browser — server never sees it.</text></g><line x1="470" x2="416" y1="402" y2="402" stroke="#06b6d4" stroke-width="1.8" marker-end="url(#aC)" opacity=".6"/><g><rect width="250" height="120" x="158" y="342" fill="#0b1a12" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)" rx="12"/><circle cx="182" cy="366" r="12" fill="#0b1a12" stroke="#22c55e" stroke-width="1.5" filter="url(#gG)"/><text x="182" y="370" fill="#22c55e" font-size="11" font-weight="800" text-anchor="middle">5</text><text x="202" y="371" fill="#22c55e" font-size="13" font-weight="700">Secret Revealed</text><rect width="210" height="28" x="178" y="390" fill="#0f2618" stroke="#22c55e" stroke-width=".7" opacity=".8" rx="5"/><text x="190" y="408" fill="#4ade80" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="10">db_password = s3cr3t!</text><text x="178" y="438" fill="#94a3b8" font-size="9.5">Decrypted entirely in the browser.</text><text x="178" y="452" fill="#22c55e" font-size="9.5" font-weight="500">✓ Plaintext never touches the server.</text></g><line x1="154" x2="98" y1="402" y2="402" stroke="#a855f7" stroke-width="1.8" marker-end="url(#aP)" opacity=".6"/><g><rect width="60" height="92" x="32" y="356" fill="#1c0a0e" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)" rx="10"/><rect width="24" height="22" x="50" y="380" fill="none" stroke="#ef4444" stroke-width="1.3" rx="3"/><line x1="46" x2="78" y1="380" y2="380" stroke="#ef4444" stroke-width="1.3"/><rect width="12" height="5" x="56" y="375" fill="none" stroke="#ef4444" stroke-width="1" rx="2"/><line x1="56" x2="56" y1="386" y2="398" stroke="#ef4444" stroke-width=".8" opacity=".6"/><line x1="62" x2="62" y1="386" y2="398" stroke="#ef4444" stroke-width=".8" opacity=".6"/><line x1="68" x2="68" y1="386" y2="398" stroke="#ef4444" stroke-width=".8" opacity=".6"/><text x="62" y="424" fill="#ef4444" font-size="8" font-weight="700" letter-spacing=".5" text-anchor="middle">GONE</text><text x="62" y="440" fill="#ef4444" font-size="7" font-weight="500" text-anchor="middle">FOREVER</text></g><line x1="32" x2="928" y1="488" y2="488" stroke="#1e293b" stroke-width=".8"/><text x="480" y="510" fill="#64748b" font-size="9" font-weight="600" letter-spacing="3" text-anchor="middle">KEY SECURITY PRINCIPLES</text><rect width="210" height="72" x="32" y="524" fill="#0b1022" stroke="#1e293b" stroke-width=".7" rx="8"/><circle cx="52" cy="546" r="4" fill="#3b82f6" filter="url(#gB)"/><text x="64" y="550" fill="#60a5fa" font-size="10.5" font-weight="700">Zero-Knowledge Server</text><text x="44" y="568" fill="#94a3b8" font-size="9.5">The server stores only encrypted</text><text x="44" y="582" fill="#94a3b8" font-size="9.5">blobs — it can never read your secrets.</text><rect width="210" height="72" x="260" y="524" fill="#0b1022" stroke="#1e293b" stroke-width=".7" rx="8"/><circle cx="280" cy="546" r="4" fill="#22c55e" filter="url(#gG)"/><text x="292" y="550" fill="#4ade80" font-size="10.5" font-weight="700">End-to-End Encrypted</text><text x="272" y="568" fill="#94a3b8" font-size="9.5">Encryption &amp; decryption happen</text><text x="272" y="582" fill="#94a3b8" font-size="9.5">exclusively in the browser (AES-256).</text><rect width="210" height="72" x="488" y="524" fill="#0b1022" stroke="#1e293b" stroke-width=".7" rx="8"/><circle cx="508" cy="546" r="4" fill="#ef4444" filter="url(#gR)"/><text x="520" y="550" fill="#f87171" font-size="10.5" font-weight="700">Auto-Destruct</text><text x="500" y="568" fill="#94a3b8" font-size="9.5">Secrets self-delete after being viewed,</text><text x="500" y="582" fill="#94a3b8" font-size="9.5">after expiry, or a reported decryption failure.</text><rect width="210" height="72" x="716" y="524" fill="#0b1022" stroke="#1e293b" stroke-width=".7" rx="8"/><circle cx="736" cy="546" r="4" fill="#eab308" filter="url(#gY)"/><text x="748" y="550" fill="#eab308" font-size="10.5" font-weight="700">No Recovery by Design</text><text x="728" y="568" fill="#94a3b8" font-size="9.5">Once deleted, data is gone forever.</text><text x="728" y="582" fill="#94a3b8" font-size="9.5">No backups. No recycle bin. No logs.</text></svg>